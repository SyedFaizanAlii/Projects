version: '3.9'

services:
  api:
    build: .
    ports:
      - "8000:80"
    volumes:
      - .:/app
    environment:
      - API_ENV=production
    command: uvicorn api.main:app --host 0.0.0.0 --port 80

  dashboard:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - .:/app
    environment:
      - API_URL=http://api:80
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
