name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint and compile
        run: |
          python -m py_compile data_pipeline.py feature_store.py model_ensemble.py drift_detector.py utils.py api/main.py dashboard/app.py
      - name: Run tests
        run: |
          python -m pytest tests
