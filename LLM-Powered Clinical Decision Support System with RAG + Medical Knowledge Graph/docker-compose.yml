version: '3.9'

services:
  neo4j:
    image: neo4j:5.11-community
    environment:
      NEO4J_AUTH: neo4j/test
      NEO4J_apoc_export_file_enabled: "true"
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "test", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    environment:
      CHROMA_DB_IMPL: "duckdb"
    volumes:
      - chroma_data:/chroma/chroma

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: test
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEBUG: "False"
    ports:
      - "8001:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: ./web/django_app
      dockerfile: Dockerfile
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "sqlite:///db.sqlite3"
    ports:
      - "8002:8000"
    depends_on:
      - api
    volumes:
      - ./web/django_app:/app

volumes:
  neo4j_data:
  chroma_data:
